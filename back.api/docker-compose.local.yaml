version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: dasom-postgres-local
    restart: unless-stopped

    ports:
      - "5432:5432"

    command: postgres -c max_connections=100 -c superuser_reserved_connections=5
    
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpw
      POSTGRES_DB: dasomweb

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d dasomweb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: