basePath: /api/v1
definitions:
  domain.CategoryType:
    enum:
    - 0
    - 1
    type: integer
    x-enum-comments:
      NoticePost: 0 공지글
    x-enum-descriptions:
    - 0 공지글
    - ""
    x-enum-varnames:
    - NoticePost
    - CategoryTypeMax
  domain.RoleType:
    enum:
    - 0
    - 1
    - 999
    type: integer
    x-enum-varnames:
    - DefaultRole
    - UserRole
    - AdminRole
  errors.AppError:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/errors.ErrorCode'
        description: 에러 코드
      message:
        description: 사용자에게 노출할 메시지
        type: string
    type: object
  errors.ErrorCode:
    enum:
    - 100
    - 101
    - 102
    - 103
    - 104
    - 105
    - 106
    - 107
    - 108
    - 109
    - 1001
    - 1002
    - 2001
    - 2002
    - 2003
    - 3001
    - 3002
    - 3003
    - 3004
    - 4001
    - 4002
    - 5000
    - 5001
    - 5003
    - 5004
    - 9999
    type: integer
    x-enum-varnames:
    - PasswordMismatchErrorCode
    - UserNotFoundErrorCode
    - EmailAlreadyExistsErrorCode
    - UserAlreadyExistsErrorCode
    - InvalidAuthHeaderErrorCode
    - TokenMissingErrorCode
    - UnAuthorizedErrorCode
    - RoleUpgradeRequestNotFoundErrorCode
    - ForbiddenErrorCode
    - BadRoleUpgradeRequestErrorCode
    - EmailVerificationErrorCode
    - EmailVerificationNotFoundErrorCode
    - PostNotFoundErrorCode
    - InvalidCategoryIDErrorCode
    - InvalidPostIDErrorCode
    - FileNotFoundErrorCode
    - UnsupportedFileErrorCode
    - FileOpenErrorCode
    - InvalidFileIDErrorCode
    - CommentNotFoundErrorCode
    - InvalidCommentIDErrorCode
    - InternalServerErrorCode
    - ShouldBindJsonErrorCode
    - ParseTemplateErrorCode
    - ApplyTemplateErrorCode
    - DBErrorCode
  utils.PaginationMetadata:
    properties:
      current_page:
        type: integer
      next_offset:
        type: integer
      prev_offset:
        type: integer
      total_count:
        type: integer
    type: object
  v1.AuthRefreshResponse:
    properties:
      access_token:
        type: string
    type: object
  v1.CommentInfo:
    properties:
      author_id:
        type: integer
      author_name:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
    type: object
  v1.CreateCommentRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  v1.CreatePostRequest:
    properties:
      category_id:
        $ref: '#/definitions/domain.CategoryType'
      content:
        type: string
      files:
        items:
          type: integer
        type: array
      title:
        type: string
    type: object
  v1.FileInfo:
    properties:
      file_name:
        type: string
      id:
        type: integer
    type: object
  v1.GetPostDetailResponse:
    properties:
      author_id:
        type: integer
      author_name:
        type: string
      category_id:
        $ref: '#/definitions/domain.CategoryType'
      comments:
        items:
          $ref: '#/definitions/v1.CommentInfo'
        type: array
      content:
        type: string
      created_at:
        type: string
      files:
        items:
          $ref: '#/definitions/v1.FileInfo'
        type: array
      id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      views:
        type: integer
    type: object
  v1.GetPostsResponse:
    properties:
      pagination:
        $ref: '#/definitions/utils.PaginationMetadata'
      posts:
        items:
          $ref: '#/definitions/v1.PostInfo'
        type: array
    type: object
  v1.LoginRequest:
    properties:
      id:
        type: integer
      password:
        type: string
    type: object
  v1.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  v1.PostInfo:
    properties:
      author_name:
        type: string
      category_id:
        $ref: '#/definitions/domain.CategoryType'
      comment_count:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      title:
        type: string
      views:
        type: integer
    type: object
  v1.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  v1.RegisterRequest:
    properties:
      id:
        type: integer
      nickname:
        type: string
      password:
        type: string
      role:
        $ref: '#/definitions/domain.RoleType'
    type: object
  v1.Response:
    properties:
      data: {}
      message:
        type: string
    type: object
  v1.UpdatePostRequest:
    properties:
      category_id:
        $ref: '#/definitions/domain.CategoryType'
      content:
        type: string
      files:
        items:
          type: integer
        type: array
      title:
        type: string
    type: object
  v1.UploadFileResponse:
    properties:
      file_id:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: back-end API for limitthon
  title: Limit Hackathon
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 로그인 및 토큰 발급 API
      parameters:
      - description: 로그인 요청 파라미터
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.LoginResponse'
              type: object
        "400":
          description: 'ErrShouldBindJson(5001): 잘못된 JSON 형식입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: 'ErrPasswordMismatch(100): 비밀번호가 일치하지 않습니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: 'ErrUserNotFound(101): 존재하지 않는 아이디입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "500":
          description: 'ErrInternalServer(5000): 토큰 발급 실패'
          schema:
            $ref: '#/definitions/errors.AppError'
      summary: 로그인
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh Token을 사용하여 새로운 Access Token 발급
      parameters:
      - description: 토큰 갱신 파라미터
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.AuthRefreshResponse'
              type: object
        "400":
          description: 'ErrShouldBindJson(5001): 잘못된 JSON 형식입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: 'ErrUnauthorized(106): 유효하지 않거나 만료된 refresh token입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "500":
          description: 'ErrInternalServer(5000): 토큰 발급 실패'
          schema:
            $ref: '#/definitions/errors.AppError'
      summary: 토큰 갱신
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: '회원가입을 위한 API. ID, 비밀번호, 닉네임 정보를 받아 회원을 등록합니다. role은 다음과 같습니다.
        (0: defaultRole, 1: user, 2: orginization, 999: admin)'
      parameters:
      - description: 회원가입 요청 파라미터
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.Response'
        "400":
          description: 'ErrShouldBindJson(5001): 잘못된 JSON 형식입니다. / ErrUserAlreadyExists(103):
            이미 존재하는 사용자입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "500":
          description: 'ErrInternalServer(5000): 비밀번호 암호화 실패 / ErrDatabase(9999):
            사용자 저장 실패'
          schema:
            $ref: '#/definitions/errors.AppError'
      summary: 회원가입
      tags:
      - Auth
  /api/v1/comments/{comment_id}:
    delete:
      description: 작성자 본인 또는 Admin만 삭제할 수 있습니다.
      parameters:
      - description: 삭제할 댓글 ID
        in: path
        name: comment_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/v1.Response'
        "400":
          description: 'ErrInvalidCommentID(4002): comment_id가 올바른 정수 형식이 아닙니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: 'ErrTokenMissing(105) / ErrInvalidAuthHeader(104): Authorization
            헤더가 없거나 형식이 올바르지 않습니다. / 유효하지 않은 토큰입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: 'ErrForbidden(108): 작성자 본인 또는 Admin이 아닙니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: 'ErrCommentNotFound(4001): 존재하지 않는 댓글입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "500":
          description: 'ErrDatabase(9999): 댓글 삭제 실패'
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - BearerAuth: []
      summary: 댓글 삭제
      tags:
      - Comment
  /api/v1/files:
    post:
      consumes:
      - multipart/form-data
      description: '허용 확장자: .jpg, .jpeg, .png, .gif, .pdf, .mp4'
      parameters:
      - description: 업로드할 파일(single)
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.UploadFileResponse'
              type: object
        "400":
          description: 'ErrShouldBindJson(5001): multipart form 파싱 실패. / ErrBadRequest(5001):
            files 파트가 비어 있습니다. / ErrUnsupportedFile(5103): 지원하지 않는 파일 확장자입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: 'ErrTokenMissing(105) / ErrInvalidAuthHeader(104): Authorization
            헤더가 없거나 형식이 올바르지 않습니다. / 유효하지 않은 토큰입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "500":
          description: 'ErrFileOpen(5102): 업로드 파일 열기 실패. / ErrDatabase(9999): 파일 메타데이터
            저장 실패.'
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - BearerAuth: []
      summary: 파일 업로드
      tags:
      - File
  /api/v1/files/{file_id}:
    delete:
      description: 업로더 본인 또는 Admin만 삭제할 수 있습니다.
      parameters:
      - description: 삭제할 파일 ID
        in: path
        name: file_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/v1.Response'
        "400":
          description: 'ErrInvalidFileID(5102): file_id가 올바른 정수 형식이 아닙니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: 'ErrTokenMissing(105) / ErrInvalidAuthHeader(104): Authorization
            헤더가 없거나 형식이 올바르지 않습니다. / 유효하지 않은 토큰입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: 'ErrForbidden(108): 업로더 본인 또는 Admin이 아닙니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: 'ErrFileNotFound(5104): 존재하지 않는 파일입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "500":
          description: 'ErrDatabase(9999): 파일 삭제 실패'
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - BearerAuth: []
      summary: 파일 삭제
      tags:
      - File
    get:
      description: 이미지, 텍스트, HTML 파일은 브라우저에서 직접 열리며, 나머지(webp, MP4 등)는 다운로드됩니다. 이미
        게시글에 첨부된 파일은 누구나(인증된 사용자라면) 다운로드할 수 있고, 아직 게시글에 첨부되지 않은 파일은 업로더 본인 또는 Admin만
        다운로드할 수 있습니다.
      parameters:
      - description: 파일 ID
        in: path
        name: file_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: 'ErrInvalidFileID(5102): file_id가 올바른 정수 형식이 아닙니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: 'ErrTokenMissing(105) / ErrInvalidAuthHeader(104): Authorization
            헤더가 없거나 형식이 올바르지 않습니다. / 유효하지 않은 토큰입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: 'ErrForbidden(108): 게시글에 첨부되지 않은 파일에 대해 업로더 본인/Admin이 아닙니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: 'ErrFileNotFound(5104): 존재하지 않는 파일입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "500":
          description: 'ErrDatabase(9999) 등: 파일 스트림을 여는 중 내부 서버 오류'
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - BearerAuth: []
      summary: 파일 다운로드
      tags:
      - File
  /api/v1/posts:
    get:
      parameters:
      - description: '게시글 카테고리 ID (0: 공지, ??? 구체화 필요)'
        in: query
        name: category_id
        type: integer
      - description: 게시글 제목 검색 키워드
        in: query
        name: title
        type: string
      - description: 작성자 ID
        in: query
        name: author_id
        type: integer
      - description: '페이지네이션 오프셋 (기본값: 0)'
        in: query
        name: offset
        type: integer
      - description: '페이지네이션 리밋 (기본값: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.GetPostsResponse'
              type: object
        "400":
          description: 'ErrInvalidCategoryID(1003): 올바른 category_id 형태가 아닙니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: 'ErrTokenMissing(105) / ErrInvalidAuthHeader(104): Authorization
            헤더가 없거나 형식이 올바르지 않습니다. / 유효하지 않은 토큰입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "500":
          description: 'ErrInternalServer(5000): 쿼리 파싱 실패 / ErrDatabase(9999): 목록
            조회 실패'
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - BearerAuth: []
      summary: 게시글 목록 조회
      tags:
      - Post
    post:
      consumes:
      - application/json
      parameters:
      - description: 게시글 생성 요청 파라미터
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.GetPostDetailResponse'
              type: object
        "400":
          description: 'ErrShouldBindJson(5001): 잘못된 JSON 형식입니다. / ErrInvalidCategoryID(1003):
            올바른 category_id 형태가 아닙니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: 'ErrTokenMissing(105) / ErrInvalidAuthHeader(104): Authorization
            헤더가 없거나 형식이 올바르지 않습니다. / 유효하지 않은 토큰입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: 'ErrForbidden(108): 작성자 본인 또는 Admin이 아닙니다. / ErrForbiddenNotice(108):
            공지사항은 관리자만 작성할 수 있습니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "500":
          description: 'ErrDatabase(9999): 게시글 생성 실패'
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - BearerAuth: []
      summary: 게시글 생성
      tags:
      - Post
  /api/v1/posts/{post_id}:
    delete:
      description: 작성자 본인 또는 Admin만 삭제할 수 있습니다.
      parameters:
      - description: 삭제할 게시글 ID
        in: path
        name: post_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/v1.Response'
        "400":
          description: 'ErrInvalidPostID(1002): post_id가 올바른 정수 형식이 아닙니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: 'ErrTokenMissing(105) / ErrInvalidAuthHeader(104): Authorization
            헤더가 없거나 형식이 올바르지 않습니다. / 유효하지 않은 토큰입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: 'ErrForbidden(108): 작성자 본인 또는 Admin이 아닙니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: 'ErrPostNotFound(1001): 존재하지 않는 게시글입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "500":
          description: 'ErrDatabase(9999): 게시글 삭제 실패'
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - BearerAuth: []
      summary: 게시글 삭제
      tags:
      - Post
    get:
      parameters:
      - description: 조회할 게시글 ID
        in: path
        name: post_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/v1.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.GetPostDetailResponse'
              type: object
        "400":
          description: 'ErrInvalidPostID(1002): post_id가 올바른 정수 형식이 아닙니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: 'ErrTokenMissing(105) / ErrInvalidAuthHeader(104): Authorization
            헤더가 없거나 형식이 올바르지 않습니다. / 유효하지 않은 토큰입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: 'ErrPostNotFound(1001): 존재하지 않는 게시글입니다.'
          schema:
            $ref: '#/definitions/errors.AppError'
        "500":
          description: 'ErrDatabase(9999): 조회수 증가 또는 조회 실패'
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - BearerAuth: []
      summary: 게시글 상세 조회
      tags:
      - Post
    patch:
      consumes:
      - application/json
      description: 작성자 본인 또는 Admin만 수정할 수 있습니다.
      parameters:
      - description: 수정할 게시글 ID
        in: path
        name: post_id
        required: true
        type: integer
      - description: 게시글 수정 요청 파라미터
        in: body
        name: request
        required: true
        schema:
